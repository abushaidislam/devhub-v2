name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Require release credential
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
