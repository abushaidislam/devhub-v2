name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Validate and prepare semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require release credential
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT is not configured as a repository Actions secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm run release:validate

      - name: Run release quality gate
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run release E2E gate
        run: npm run test:e2e
        env:
          CI: true

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
