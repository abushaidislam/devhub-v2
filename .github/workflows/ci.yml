name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Context, types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Context check
        run: npm run context:check

      - name: Validate release configuration
        run: npm run release:validate

      - name: Dry-run release package
        run: npm pack --dry-run --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npx next build
